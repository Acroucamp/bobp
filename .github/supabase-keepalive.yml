# Free Supabase projects can be paused after about a week of inactivity.
# This sends a tiny request every 3 days to keep the project active.
#
# Setup: GitHub repo > Settings > Secrets and variables > Actions > New secret
#   SUPABASE_URL              https://YOUR-REF.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  sb_publishable_...   (the public key, not the secret key)
#
# Note: GitHub disables scheduled workflows after 60 days without repo activity.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/businesses?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY"
